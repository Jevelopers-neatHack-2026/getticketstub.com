name: Correlated available-app fixture
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  available-app-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Verify evidence integrity and negative controls
        run: node --test tests/integration-evidence.test.mjs
      - run: npm run build
      - name: Execute all 14 correlated available-app cases once (offline)
        run: npm run verify:product -- --suite integration --mode fixture --evidence-dir /tmp/ticketstub-correlated-evidence
      - name: Retain every correlated result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: available-app-integration-evidence
          path: /tmp/ticketstub-correlated-evidence
          if-no-files-found: warn
